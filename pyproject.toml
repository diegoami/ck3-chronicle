[project]
name = "ck3-chronicle"
version = "0.1.0.dev0"
description = "Chronicles of Crusader Kings III playthroughs: a directory of save games in, a static wiki out."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Diego Amicabile" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["crusader-kings", "ck3", "save-game", "wiki", "static-site"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment :: Real Time Strategy",
]

[project.optional-dependencies]
# realm maps drawn from the game's own map files (M7)
maps = [
    "Pillow>=10",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/diegoami/ck3-chronicle"
Issues = "https://github.com/diegoami/ck3-chronicle/issues"

[project.scripts]
ck3chronicle = "ck3chronicle.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ck3chronicle"]

[tool.hatch.build.targets.sdist]
include = ["src/ck3chronicle", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
