name: Release

# Publishing a GitHub release uploads its version to PyPI through trusted
# publishing: no token is stored anywhere. The owner connects it once on PyPI
# (project ck3-chronicle, repository diegoami/ck3-chronicle, workflow
# release.yml, environment pypi); until then the publish step fails and
# nothing is uploaded.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked --group dev
      - run: uv run pytest -q
      - run: uv build
      - name: The release tag names the version being built
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(uv run --no-sync python -c "import ck3chronicle; print(ck3chronicle.__version__)")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match the package version $version (expected v$version)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ck3-chronicle/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  desktop:
    # the Windows .exe, attached to the release (unsigned: SmartScreen warns)
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write  # to attach the .exe to this release
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group desktop
      - name: Build the .exe
        run: >
          uv run pyinstaller --noconfirm --onefile --windowed
          --name "ck3-chronicle-${{ github.event.release.tag_name }}-windows" --copy-metadata ck3-chronicle
          packaging/desktop.py
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/ck3-chronicle-${{ github.event.release.tag_name }}-windows.exe"
